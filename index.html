
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHB Inventory</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div style="text-align:center;">
        <h2>PHB Inventory Tracking Sheet</h2>
      </div>
      <div id="category-buttons"></div>
      <button onclick="exportCSV()">Export as CSV</button>
      <div style="margin-top:10px;">
        <a href="PHB_Inventory_Sheet.pdf" download class="download-btn orange-btn">Download Inventory PDF</a>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-bar" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px;">
        <input id="new-item-name" type="text" placeholder="Item name" />
        <input id="new-item-qty" type="number" placeholder="Qty" />
        <button onclick="addItem()">Add Item</button>
        <input id="search" type="text" placeholder="Search..." oninput="renderItems()" style="flex: 1;" />
      </div>

      <h3 id="category-title" class="category-heading"></h3>

      <table id="items-table">
        <thead>
          <tr>
            <th>Item Name</th>
            <th style="text-align: center;">Quantity</th>
            <th style="text-align: center;">Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
  </div>

  <footer class="footer">
    &copy; 2025 Anil Kumar Reddy. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
